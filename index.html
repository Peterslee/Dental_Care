<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dental Care - Pasien & Pengeluaran</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header h1 {
      font-size: 2.5rem;
      color: #007BFF;
    }

    .header p {
      color: #555;
      font-size: 1.1rem;
    }

    .form-container {
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      margin-bottom: 30px;
    }

    .form-container h2 {
      background-color: #007BFF;
      color: white;
      padding: 10px;
      text-align: center;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .form-container h3 {
      background-color: red;
      color: white;
      padding: 10px;
      text-align: center;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #007BFF;
      color: white;
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    .table-container {
      max-width: 900px;
      width: 100%;
      overflow-x: auto;
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #007BFF;
      color: white;
    }

    td[contenteditable="true"] {
      background-color: #fdfdfd;
      cursor: text;
    }

    .total {
      font-weight: bold;
      text-align: right;
      margin-top: 10px;
      font-size: 1.1rem;
    }

    .buttons {
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .form-container {
        padding: 15px;
      }

      th, td {
        padding: 10px;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      button {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Dental Care</h1>
    <p id="tanggal"></p>
  </div>

  <div class="buttons">
    <button onclick="window.print()">Cetak PDF</button>
    <button onclick="exportToExcel()">Export ke Excel</button>
    <button onclick="exportToJSON()">Export ke JSON</button>
    <button onclick="hapusSemuaData()">Hapus Semua Data</button>
  </div>

  <div class="form-container">
    <h2>Tambah Pasien</h2>
    <form id="dataForm">
      <label>Nama:</label>
      <input type="text" id="nama" required>
      <label>Alamat:</label>
      <input type="text" id="alamat" required>
      <label>Keluhan:</label>
      <textarea id="keluhan" required rows="3"></textarea>
      <button type="submit">Tambah Pasien</button>
    </form>
  </div>

  <div class="form-container">
    <h3>Tambah Pengeluaran</h3>
    <form id="pengeluaranForm">
      <label>Jumlah Pengeluaran (Rp):</label>
      <input type="number" id="jumlahPengeluaran" required>
      <label>Keterangan Pengeluaran:</label>
      <input type="text" id="keteranganPengeluaran" required>
      <button type="submit">Tambah Pengeluaran</button>
    </form>
  </div>

  <div class="table-container">
    <table id="pasienTable">
      <thead>
        <tr>
          <th>Nomor</th>
          <th>Nama</th>
          <th>Alamat</th>
          <th>Keluhan</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="table-container">
    <table id="bayaranTable">
      <thead>
        <tr>
          <th>Nomor</th>
          <th>Bayaran (Rp)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="total" id="totalBayaran">Total Bayaran: Rp 0</div>
  </div>

  <div class="table-container">
    <table id="pengeluaranTable">
      <thead>
        <tr>
          <th>Nomor</th>
          <th>Pengeluaran (Rp)</th>
          <th>Keterangan</th>
        </tr>
      </thead>
      <tbody id="pengeluaranBody"></tbody>
    </table>
    <div class="total" id="totalPengeluaran">Total Pengeluaran: Rp 0</div>
  </div>

  <div class="total" id="sisaUang">Sisa Uang: Rp 0</div>

  <script>
    let nomor = 1;

    const form = document.getElementById('dataForm');
    const pengeluaranForm = document.getElementById('pengeluaranForm');
    const pasienTable = document.querySelector('#pasienTable tbody');
    const bayaranTable = document.querySelector('#bayaranTable tbody');
    const pengeluaranBody = document.getElementById('pengeluaranBody');

    const totalBayaranEl = document.getElementById('totalBayaran');
    const totalPengeluaranEl = document.getElementById('totalPengeluaran');
    const sisaUangEl = document.getElementById('sisaUang');

    const tgl = new Date().toLocaleDateString('id-ID', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    document.getElementById('tanggal').textContent = `Tanggal: ${tgl}`;

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const alamat = document.getElementById('alamat').value;
      const keluhan = document.getElementById('keluhan').value;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${nomor}</td>
        <td>${nama}</td>
        <td>${alamat}</td>
        <td>${keluhan}</td>
      `;
      pasienTable.appendChild(row);

      const bayarRow = document.createElement('tr');
      bayarRow.innerHTML = `
        <td>${nomor}</td>
        <td contenteditable="true" oninput="updateTotal(); saveData()">0</td>
      `;
      bayaranTable.appendChild(bayarRow);

      nomor++;
      form.reset();
      updateTotal();
      saveData();
    });

    pengeluaranForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const jumlah = document.getElementById('jumlahPengeluaran').value;
      const keterangan = document.getElementById('keteranganPengeluaran').value;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${pengeluaranBody.rows.length + 1}</td>
        <td>${jumlah}</td>
        <td>${keterangan}</td>
      `;
      pengeluaranBody.appendChild(row);

      pengeluaranForm.reset();
      updateTotal();
      saveData();
    });

    function updateTotal() {
      let totalBayar = 0;
      let totalPengeluaran = 0;

      const bayarCells = bayaranTable.querySelectorAll('td[contenteditable="true"]');
      bayarCells.forEach(cell => {
        totalBayar += parseInt(cell.textContent.replace(/\D/g, '')) || 0;
      });

      const pengeluaranRows = pengeluaranBody.querySelectorAll('tr');
      pengeluaranRows.forEach(row => {
        const cell = row.children[1];
        totalPengeluaran += parseInt(cell.textContent.replace(/\D/g, '')) || 0;
      });

      const sisa = totalBayar - totalPengeluaran;

      totalBayaranEl.textContent = `Total Bayaran: Rp ${totalBayar.toLocaleString()}`;
      totalPengeluaranEl.textContent = `Total Pengeluaran: Rp ${totalPengeluaran.toLocaleString()}`;
      sisaUangEl.textContent = `Sisa Uang: Rp ${sisa.toLocaleString()}`;
    }

    function saveData() {
      const pasienData = Array.from(pasienTable.children).map(row => ({
        nomor: row.children[0].textContent,
        nama: row.children[1].textContent,
        alamat: row.children[2].textContent,
        keluhan: row.children[3].textContent
      }));

      const bayaranData = Array.from(bayaranTable.children).map(row => ({
        nomor: row.children[0].textContent,
        bayaran: row.children[1].textContent
      }));

      const pengeluaranData = Array.from(pengeluaranBody.children).map(row => ({
        nomor: row.children[0].textContent,
        jumlah: row.children[1].textContent,
        keterangan: row.children[2].textContent
      }));

      localStorage.setItem("pasienData", JSON.stringify(pasienData));
      localStorage.setItem("bayaranData", JSON.stringify(bayaranData));
      localStorage.setItem("pengeluaranData", JSON.stringify(pengeluaranData));
    }

    function loadData() {
      const pasienData = JSON.parse(localStorage.getItem("pasienData")) || [];
      const bayaranData = JSON.parse(localStorage.getItem("bayaranData")) || [];
      const pengeluaranData = JSON.parse(localStorage.getItem("pengeluaranData")) || [];

      pasienData.forEach(data => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${data.nomor}</td>
          <td>${data.nama}</td>
          <td>${data.alamat}</td>
          <td>${data.keluhan}</td>
        `;
        pasienTable.appendChild(row);
      });

      bayaranData.forEach(data => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${data.nomor}</td>
          <td contenteditable="true" oninput="updateTotal(); saveData()">${data.bayaran}</td>
        `;
        bayaranTable.appendChild(row);
      });

      pengeluaranData.forEach(data => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${data.nomor}</td>
          <td>${data.jumlah}</td>
          <td>${data.keterangan}</td>
        `;
        pengeluaranBody.appendChild(row);
      });

      nomor = pasienData.length + 1;
      updateTotal();
    }

    function exportToExcel() {
      const wb = XLSX.utils.book_new();
      const pasien = document.getElementById('pasienTable');
      const bayaran = document.getElementById('bayaranTable');
      const pengeluaran = document.getElementById('pengeluaranTable');

      const sheet1 = XLSX.utils.table_to_sheet(pasien);
      const sheet2 = XLSX.utils.table_to_sheet(bayaran);
      const sheet3 = XLSX.utils.table_to_sheet(pengeluaran);

      XLSX.utils.book_append_sheet(wb, sheet1, 'Data Pasien');
      XLSX.utils.book_append_sheet(wb, sheet2, 'Bayaran');
      XLSX.utils.book_append_sheet(wb, sheet3, 'Pengeluaran');

      XLSX.writeFile(wb, 'data_dental_care.xlsx');
    }

    function exportToJSON() {
      const pasienData = JSON.parse(localStorage.getItem("pasienData")) || [];
      const bayaranData = JSON.parse(localStorage.getItem("bayaranData")) || [];
      const pengeluaranData = JSON.parse(localStorage.getItem("pengeluaranData")) || [];

      const dataGabungan = {
        pasien: pasienData,
        bayaran: bayaranData,
        pengeluaran: pengeluaranData
      };

      const blob = new Blob([JSON.stringify(dataGabungan, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "backup_dental_care.json";
      link.click();
    }

    function hapusSemuaData() {
      if (confirm("Yakin ingin menghapus semua data?")) {
        localStorage.removeItem("pasienData");
        localStorage.removeItem("bayaranData");
        localStorage.removeItem("pengeluaranData");
        location.reload();
      }
    }

    loadData();
  </script>
</body>
</html>
