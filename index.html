<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dental Care - Form Pasien & Pengeluaran</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #007BFF;
      font-size: 2.5em;
      margin: 0;
    }

    .header p {
      font-size: 1.2em;
      color: #555;
    }

    .form-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .table-container {
      width: 100%;
      max-width: 800px;
      overflow-x: auto;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    caption {
      caption-side: top;
      text-align: left;
      font-size: 1.2em;
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
    }

    .total-container {
      text-align: right;
      font-size: 1.1em;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
    }

    .balance {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-size: 1.2em;
      text-align: center;
      max-width: 800px;
      width: 100%;
    }

    /* Responsif */
    @media (max-width: 768px) {
      .form-container {
        padding: 20px;
      }

      .table-container {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
      }

      th, td {
        padding: 10px;
      }

      .balance {
        font-size: 1em;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }

      .form-container {
        width: 100%;
        margin-bottom: 20px;
      }

      button {
        padding: 10px;
        font-size: 14px;
      }

      th, td {
        padding: 8px;
      }

      .balance {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>

  <!-- Header dengan judul dan tanggal -->
  <div class="header">
    <h1>Dental Care</h1>
    <p id="currentDate"></p>
  </div>

  <!-- Form Pasien -->
  <div class="form-container">
    <h2>Data Pasien</h2>
    <form id="dataForm">
      <label for="nama">Nama:</label>
      <input type="text" id="nama" required>

      <label for="alamat">Alamat:</label>
      <input type="text" id="alamat" required>

      <label for="keluhan">Keluhan:</label>
      <textarea id="keluhan" rows="3" required></textarea>

      <label for="bayaran">Bayaran (Rp):</label>
      <input type="number" id="bayaran" required>

      <button type="submit">Kirim Data Pasien</button>
    </form>
  </div>

  <!-- Tabel Pasien -->
  <div class="table-container">
    <table id="hasilTable" style="display: none;">
      <caption>Data Pasien</caption>
      <thead>
        <tr>
          <th>Nomor</th>
          <th>Nama</th>
          <th>Alamat</th>
          <th>Keluhan</th>
          <th>Bayaran (Rp)</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="4" style="text-align: right; font-weight: bold;">Total Bayaran:</td>
          <td id="footerTotalBayaran">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- Form Pengeluaran -->
  <div class="form-container">
    <h2>Pengeluaran</h2>
    <form id="pengeluaranForm">
      <label for="keterangan">Keterangan:</label>
      <input type="text" id="keterangan" required>

      <label for="jumlah">Jumlah Pengeluaran (Rp):</label>
      <input type="number" id="jumlah" required>

      <button type="submit">Tambah Pengeluaran</button>
    </form>
  </div>

  <!-- Tabel Pengeluaran -->
  <div class="table-container">
    <table id="pengeluaranTable" style="display: none;">
      <caption>Data Pengeluaran</caption>
      <thead>
        <tr>
          <th>Nomor</th>
          <th>Keterangan</th>
          <th>Jumlah (Rp)</th>
        </tr>
      </thead>
      <tbody id="pengeluaranBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="2" style="text-align: right; font-weight: bold;">Total Pengeluaran:</td>
          <td id="footerTotalPengeluaran">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- Sisa Uang -->
  <div class="balance" id="sisaUang" style="display: none;">
    Sisa Uang: Rp 0
  </div>

  <!-- Script -->
  <script>
    let nomorPasien = 1;
    let nomorPengeluaran = 1;
    let totalBayaran = 0;
    let totalPengeluaran = 0;

    const pasienForm = document.getElementById('dataForm');
    const pasienTable = document.getElementById('hasilTable');
    const pasienBody = document.getElementById('tableBody');
    const footerBayaran = document.getElementById('footerTotalBayaran');

    const pengeluaranForm = document.getElementById('pengeluaranForm');
    const pengeluaranTable = document.getElementById('pengeluaranTable');
    const pengeluaranBody = document.getElementById('pengeluaranBody');
    const footerPengeluaran = document.getElementById('footerTotalPengeluaran');

    const sisaUang = document.getElementById('sisaUang');

    // Menampilkan tanggal real-time
    const currentDateElement = document.getElementById('currentDate');
    const today = new Date();
    const formattedDate = today.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    currentDateElement.textContent = `Tanggal: ${formattedDate}`;

    // Tambah data pasien
    pasienForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const nama = document.getElementById('nama').value;
      const alamat = document.getElementById('alamat').value;
      const keluhan = document.getElementById('keluhan').value;
      const bayaran = parseInt(document.getElementById('bayaran').value);

      totalBayaran += bayaran;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${nomorPasien++}</td>
        <td>${nama}</td>
        <td>${alamat}</td>
        <td>${keluhan}</td>
        <td>${bayaran.toLocaleString()}</td>
      `;
      pasienBody.appendChild(row);

      footerBayaran.textContent = totalBayaran.toLocaleString();
      pasienTable.style.display = 'table';
      updateSisaUang();

      pasienForm.reset();
    });

    // Tambah pengeluaran
    pengeluaranForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const keterangan = document.getElementById('keterangan').value;
      const jumlah = parseInt(document.getElementById('jumlah').value);

      totalPengeluaran += jumlah;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${nomorPengeluaran++}</td>
        <td>${keterangan}</td>
        <td>${jumlah.toLocaleString()}</td>
      `;
      pengeluaranBody.appendChild(row);

      footerPengeluaran.textContent = totalPengeluaran.toLocaleString();
      pengeluaranTable.style.display = 'table';
      updateSisaUang();

      pengeluaranForm.reset();
    });

    // Hitung sisa uang
    function updateSisaUang() {
      const sisa = totalBayaran - totalPengeluaran;
      sisaUang.style.display = 'block';
      sisaUang.textContent = `Sisa Uang: Rp ${sisa.toLocaleString()}`;
    }
  </script>

</body>
</html>
